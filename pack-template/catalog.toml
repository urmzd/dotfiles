# Pack packages, in the dotfiles catalog.toml format. They join the
# `dotfiles package` picker on every machine using this pack; entries
# with `required = true` install everywhere without being picked.
#
# Fields: id, name, description, category (required strings); install with
# tap/brew/cask (macOS), apt/dnf/pacman (Linux), npm, uv, or script (an
# installer URL, run when `check` fails); setup lists sign-in commands for
# `dotfiles package setup`; check is a shell test that passes once installed.
#
# GUI apps: give every cask an `apps` entry (cask -> app bundle in
# /Applications). When that app is already installed (by hand, the App Store,
# or self-updated past the cask version) the cask is skipped and counted as
# installed instead of failing. Reuse a dotfiles category where one fits
# (productivity, chat, editors, notes, ai, media); category is free text and
# groups the `dotfiles package` picker.
# Ids already taken (dotfiles catalog or an earlier pack) are skipped. A file that fails these checks
# is ignored (with a warning) and never breaks an apply.

# [[package]]
# id = "company-vpn"
# name = "Company VPN"
# description = "Required for internal hosts"
# category = "work"
# cask = ["example-vpn"]
# apps = { "example-vpn" = "Example VPN.app" }
# required = true

# [[package]]
# id = "internal-cli"
# name = "internal-cli"
# description = "Deploys, logs, and on-call from the terminal"
# category = "work"
# script = "https://tools.example.com/internal-cli/install.sh"
# check = "command -v internal-cli"
# setup = ["internal-cli login"]

