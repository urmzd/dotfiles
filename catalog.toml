# ---- Work tools -------------------------------------------------------------

[[package]]
id = "acli"
name = "Atlassian CLI"
description = "Jira, Confluence, and Rovo Dev from the terminal"
category = "work"
tap = ["atlassian/acli"]
brew = ["atlassian/acli/acli"]
setup = ["acli jira auth login --web"]
check = "acli jira auth status"

[[package]]
id = "twg"
name = "Teamwork Graph CLI"
# The official installer signs in with OAuth in the browser and installs agent
# skills, so it needs a TTY: it runs from `dotfiles setup`, never during apply.
description = "Gives coding agents your Jira, Confluence, and Bitbucket data"
category = "work"
setup = ["curl -fsSL --retry 2 https://teamwork-graph.atlassian.com/cli/install | bash"]
check = "command -v twg >/dev/null && twg doctor >/dev/null 2>&1"
